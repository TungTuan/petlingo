services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: petlingo
      POSTGRES_PASSWORD: petlingo
      POSTGRES_DB: petlingo
    ports:
      - "5432:5432"
    volumes:
      - petlingo_pgdata:/var/lib/postgresql/data

volumes:
  petlingo_pgdata:
